    - gguf
    - cuantizacion
    - modelo local
    - lm studio
    - vram
    - inferencia local
    - whisper
    - comfyui
  P3:
    - alucinacion
    - evaluacion de modelos
    - benchmark
    - sesgo
    - alineacion
    - trazabilidad
    - citas verificables
    - rag
  P4:
    - automatizacion
    - script
    - powershell
    - pandas
    - scraping
    - playwright
    - excel
    - flujo de trabajo
    - cli
  P5:
    - podcast
    - entrevista
    - microfono
    - analisis
    - episodio
    - audio
    - edicion de audio
  P6:
    - emulador
    - retro
    - consola
    - videojuego
    - arcade
